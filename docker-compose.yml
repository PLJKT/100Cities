version: "3.9"

services:
  backend:
    build: ./backend
    container_name: cities100-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    networks:
      - app-net

  frontend:
    build: ./frontend
    container_name: cities100-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
