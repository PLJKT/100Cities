name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm install
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # CI 用最小可用 env，避免缺环境变量启动失败
      JWT_SECRET: ci_dummy_secret
      DB_TYPE: sqlite
      DB_FILE: ./data/test.sqlite
      MAIL_TO: ci@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install deps
        run: npm install
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
